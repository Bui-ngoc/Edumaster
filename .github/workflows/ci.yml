name: CI — EduMaster Flutter

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]

jobs:
  flutter-ci:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Flutter (stable channel, caches pub deps)
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      # 3. Install dependencies
      - name: Install pub dependencies
        run: flutter pub get

      # 4. Static analysis — must be zero issues (Criteria 7)
      - name: Run flutter analyze
        run: flutter analyze --fatal-infos

      # 5. Run all unit + widget tests (Criteria 5: ≥15 tests)
      - name: Run flutter test
        run: flutter test --reporter=expanded

      # 6. Build debug APK to verify no compile errors
      - name: Build debug APK
        run: flutter build apk --debug

      # 7. Upload APK as CI artifact
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
